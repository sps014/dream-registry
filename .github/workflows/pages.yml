name: Registry website
on:
  push:
    branches: [feat/site]
  pull_request:
    branches: [feat/site]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: registry-website
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'feat/site' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/site.js
      - run: python scripts/build_site.py --output _demo-site

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/site
          fetch-depth: 1
      - name: Fetch current registry data for deployment only
        uses: actions/checkout@v4
        with:
          ref: main
          path: .registry-data
          fetch-depth: 1
          sparse-checkout: |
            /index/
            /dl/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_site.py --registry .registry-data --base-path /dream-registry
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
