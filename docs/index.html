<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dream Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0f14;
      --bg-elev: #141a22;
      --ink: #e8edf5;
      --muted: #8b97a8;
      --accent: #5eead4;
      --accent-dim: #2dd4bf33;
      --line: #243041;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 12% -8%, #134e4a55 0%, transparent 55%),
        radial-gradient(700px 400px at 100% 0%, #1e3a5f44 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 2.75rem 1.25rem 4rem;
    }
    header { margin-bottom: 1.75rem; }
    .brand {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 0.55rem;
    }
    h1 {
      font-size: clamp(1.85rem, 4.5vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.45rem;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 1.02rem;
      max-width: 34rem;
    }
    .search-wrap { margin: 1.75rem 0 0.85rem; }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input[type="search"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      font-size: 1rem;
      font-family: inherit;
      background: var(--bg-elev);
      color: var(--ink);
    }
    input[type="search"]::placeholder { color: #5c6b7e; }
    input[type="search"]:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      border-color: var(--accent);
    }
    .meta {
      margin: 0 0 1.1rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .pkg {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 1rem 1.15rem;
      margin: 0 0 0.65rem;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .pkg:hover, .pkg[aria-expanded="true"] {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      background: #18212c;
    }
    .pkg-top {
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .pkg-name {
      margin: 0;
      font-size: 1.08rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
    }
    .pkg-vers {
      color: var(--accent);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.92rem;
    }
    .desc {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.65rem;
    }
    .tag {
      font-size: 0.72rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid #2dd4bf44;
    }
    .detail {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .pkg[aria-expanded="true"] .detail { display: block; }
    .detail-row {
      margin: 0 0 0.85rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .detail-row strong { color: var(--ink); font-weight: 500; }
    .install-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .install {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }
    .install code {
      flex: 1;
      display: block;
      padding: 0.7rem 0.85rem;
      border-radius: 0.5rem;
      background: #0a0d12;
      border: 1px solid var(--line);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.86rem;
      color: var(--ink);
      overflow-x: auto;
      white-space: nowrap;
    }
    .copy {
      border: 1px solid var(--line);
      background: #0a0d12;
      color: var(--accent);
      border-radius: 0.5rem;
      padding: 0 0.9rem;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .copy:hover { border-color: var(--accent); }
    .copy.done { color: var(--warn); }
    .empty { color: var(--muted); padding: 1.25rem 0; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">Dream Registry</p>
      <h1>Packages</h1>
      <p class="lede">
        Discover libraries for the Dream language. Select a package to see how to add it to your project.
      </p>
    </header>

    <div class="search-wrap">
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="Search packages…" autocomplete="off" />
    </div>
    <p class="meta" id="status">Loading packages…</p>
    <div id="results" role="list"></div>

    <footer>
      <a href="https://sps014.github.io/dream/getting-started/">Install Dream</a>
      ·
      <a href="https://sps014.github.io/dream/tooling/package-manager/">Package manager guide</a>
    </footer>
  </main>
  <script>
    const INDEX_URL =
      "https://raw.githubusercontent.com/sps014/dream-registry/main/catalog.json";

    let packages = [];
    let selected = null;

    function matches(entry, needle) {
      if (!needle) return true;
      const n = needle.toLowerCase();
      if ((entry.name || "").toLowerCase().includes(n)) return true;
      if ((entry.description || "").toLowerCase().includes(n)) return true;
      return (entry.keywords || []).some((k) => String(k).toLowerCase().includes(n));
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function installCmd(name) {
      return "dreamer add " + name;
    }

    function render(query) {
      const root = document.getElementById("results");
      const status = document.getElementById("status");
      const filtered = packages.filter((e) => matches(e, query));
      const total = packages.length;
      status.textContent =
        filtered.length === total
          ? total + (total === 1 ? " package" : " packages")
          : filtered.length + " of " + total + " packages";

      if (!filtered.length) {
        root.innerHTML = '<p class="empty">No packages found.</p>';
        return;
      }

      root.innerHTML = filtered
        .map((e) => {
          const open = selected === e.name;
          const tags = [];
          if (e.type) tags.push(e.type);
          if (e.license) tags.push(e.license);
          (e.keywords || []).slice(0, 6).forEach((k) => tags.push(k));
          const tagHtml = tags
            .map((t) => '<span class="tag">' + escapeHtml(t) + "</span>")
            .join("");
          const desc = e.description
            ? '<p class="desc">' + escapeHtml(e.description) + "</p>"
            : "";
          const authors =
            e.authors && e.authors.length
              ? '<p class="detail-row"><strong>Authors</strong> · ' +
                escapeHtml(e.authors.join(", ")) +
                "</p>"
              : "";
          const cmd = installCmd(e.name);
          return (
            '<button type="button" class="pkg" role="listitem" data-name="' +
            escapeHtml(e.name) +
            '" aria-expanded="' +
            (open ? "true" : "false") +
            '">' +
            '<div class="pkg-top">' +
            '<h2 class="pkg-name">' +
            escapeHtml(e.name) +
            "</h2>" +
            '<span class="pkg-vers">v' +
            escapeHtml(e.vers) +
            "</span>" +
            "</div>" +
            desc +
            (tagHtml ? '<div class="tags">' + tagHtml + "</div>" : "") +
            '<div class="detail">' +
            authors +
            '<p class="install-label">Install</p>' +
            '<div class="install">' +
            "<code>" +
            escapeHtml(cmd) +
            "</code>" +
            '<button type="button" class="copy" data-cmd="' +
            escapeHtml(cmd) +
            '">Copy</button>' +
            "</div>" +
            "</div>" +
            "</button>"
          );
        })
        .join("");
    }

    document.getElementById("results").addEventListener("click", (ev) => {
      const copy = ev.target.closest(".copy");
      if (copy) {
        ev.stopPropagation();
        const cmd = copy.getAttribute("data-cmd") || "";
        navigator.clipboard.writeText(cmd).then(() => {
          copy.classList.add("done");
          copy.textContent = "Copied";
          setTimeout(() => {
            copy.classList.remove("done");
            copy.textContent = "Copy";
          }, 1200);
        });
        return;
      }
      const btn = ev.target.closest(".pkg");
      if (!btn) return;
      const name = btn.getAttribute("data-name");
      selected = selected === name ? null : name;
      render(document.getElementById("q").value.trim());
    });

    document.getElementById("q").addEventListener("input", (ev) => {
      render(ev.target.value.trim());
    });

    fetch(INDEX_URL)
      .then((r) => {
        if (!r.ok) throw new Error("Could not load package index");
        return r.json();
      })
      .then((data) => {
        packages = Array.isArray(data) ? data : [];
        packages.sort((a, b) => String(a.name).localeCompare(String(b.name)));
        render("");
      })
      .catch((err) => {
        document.getElementById("status").textContent = err.message || "Failed to load packages";
      });
  </script>
</body>
</html>
